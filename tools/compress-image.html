<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Compress IMAGE – ImageHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../assets/css/shared.css"/>
<script src="../assets/js/shared.js"></script>
</head>
<body>
<div id="dlModal"></div>
<nav>
  <a class="logo" href="../pages/index.html" aria-label="ImageHub home"><img src="../assets/icons/imagehub-logo.svg" alt=""/>ImageHub</a>
  <div class="nav-right-tools">
    <a class="back" href="../pages/index.html"><i class="fas fa-chevron-left"></i> All Tools</a>
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark">
      <span class="t-label" id="themeLabel">Dark</span>
      <div class="toggle-track"><div class="toggle-knob"><i class="fas fa-moon"></i></div></div>
    </div>
  </div>
</nav>
<div class="tool-wrap">
  <div class="tool-header">
    <div class="tool-icon" style="color:var(--a3)"><i class="fas fa-compress-alt"></i></div>
    <h1>Compress IMAGE</h1>
    <p>Shrink your image's file size while keeping the quality you choose. Everything runs in your browser.</p>
  </div>
  <div class="drop-area" id="drop" onclick="document.getElementById('fin').click()">
    <i class="fas fa-cloud-upload-alt"></i>
    <div class="dl">Drop an image here or click to upload</div>
    <div class="ds">JPG, PNG or WebP</div>
  </div>
  <input type="file" id="fin" accept="image/*" hidden/>

  <div class="preview-wrap" id="pwrap"><img id="preview"/></div>

  <div class="controls" id="controls" style="display:none">
    <div class="control-row">
      <label>Quality</label>
      <input type="range" id="quality" min="10" max="100" value="75" oninput="updateQualityLabel();liveEstimate()"/>
      <span class="val" id="qval">75%</span>
    </div>
    <div class="control-row">
      <label>Output format</label>
      <div class="chip-group" id="fmtChips">
        <div class="chip active" data-fmt="image/jpeg">JPG</div>
        <div class="chip" data-fmt="image/webp">WebP</div>
        <div class="chip" data-fmt="image/png">PNG</div>
      </div>
    </div>
    <div class="control-row">
      <label>Original size</label>
      <span class="val" id="origSize" style="text-align:left">—</span>
    </div>
    <div class="control-row">
      <label>Estimated size</label>
      <span class="val" id="estSize" style="text-align:left;color:var(--a3)">—</span>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="goBtn" disabled onclick="compressImage()"><i class="fas fa-compress-alt"></i> Compress Image</button>
    <button class="btn btn-secondary" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
let currentFile=null, currentImg=null, fmt='image/jpeg';
const drop=document.getElementById('drop'),fin=document.getElementById('fin'),goBtn=document.getElementById('goBtn');
fin.onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0]);fin.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])};

document.querySelectorAll('#fmtChips .chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('#fmtChips .chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');fmt=c.dataset.fmt;liveEstimate();
});

async function handleFile(file){
  currentFile=file;
  const {img,url}=await loadImageFile(file);
  currentImg=img;
  document.getElementById('preview').src=url;
  document.getElementById('pwrap').classList.add('show');
  document.getElementById('controls').style.display='flex';
  document.getElementById('origSize').textContent=fmtSize(file.size);
  goBtn.disabled=false;
  liveEstimate();
}

function updateQualityLabel(){document.getElementById('qval').textContent=document.getElementById('quality').value+'%'}

let estTimer=null;
function liveEstimate(){
  clearTimeout(estTimer);
  estTimer=setTimeout(async ()=>{
    if(!currentImg)return;
    const canvas=document.createElement('canvas');
    canvas.width=currentImg.naturalWidth;canvas.height=currentImg.naturalHeight;
    canvas.getContext('2d').drawImage(currentImg,0,0);
    const q=fmt==='image/png'?undefined:document.getElementById('quality').value/100;
    const blob=await canvasToBlob(canvas,fmt,q);
    document.getElementById('estSize').textContent=fmtSize(blob.size);
  },250);
}

function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status show '+type}

async function compressImage(){
  goBtn.disabled=true;showStatus('Compressing…','info');
  try{
    const canvas=document.createElement('canvas');
    canvas.width=currentImg.naturalWidth;canvas.height=currentImg.naturalHeight;
    canvas.getContext('2d').drawImage(currentImg,0,0);
    const q=fmt==='image/png'?undefined:document.getElementById('quality').value/100;
    const blob=await canvasToBlob(canvas,fmt,q);
    const ext=fmt==='image/jpeg'?'jpg':fmt==='image/webp'?'webp':'png';
    downloadBlob(blob,'compressed.'+ext);
    saveHistoryTool('Compress IMAGE','../tools/compress-image.html');
    const pct=(100-(blob.size/currentFile.size*100)).toFixed(0);
    showStatus(pct>0?`✓ Done! Reduced by ${pct}%.`:'✓ Done!','success');
  }catch(e){showStatus('Error: '+e.message,'error')}
  goBtn.disabled=false;
}
function clearAll(){
  resetToolUploadState(()=>{
    currentFile=null;currentImg=null;
    document.getElementById('pwrap').classList.remove('show');
    document.getElementById('controls').style.display='none';
    goBtn.disabled=true;
    document.getElementById('status').className='status';
  });
}
</script>
<div class="tool-footer"><a class="tf-logo" href="../pages/index.html">ImageHub</a><p>Free forever · No sign-up · No uploads to server</p></div>
</body></html>
