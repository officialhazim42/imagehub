<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blur Face – ImageHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../assets/css/shared.css"/>
<script src="../assets/js/shared.js"></script>
<style>#cv{cursor:crosshair}</style>
</head>
<body>
<div id="dlModal"></div>
<nav>
  <a class="logo" href="../pages/index.html" aria-label="ImageHub home"><img src="../assets/icons/imagehub-logo.svg" alt=""/>ImageHub</a>
  <div class="nav-right-tools">
    <a class="back" href="../pages/index.html"><i class="fas fa-chevron-left"></i> All Tools</a>
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark">
      <span class="t-label" id="themeLabel">Dark</span>
      <div class="toggle-track"><div class="toggle-knob"><i class="fas fa-moon"></i></div></div>
    </div>
  </div>
</nav>
<div class="tool-wrap">
  <div class="tool-header">
    <div class="tool-icon" style="color:#facc15"><i class="fas fa-user-secret"></i></div>
    <h1>Blur Face</h1>
    <p>Drag a box over each face (or anything else) to pixelate it. Draw as many boxes as you need.</p>
  </div>
  <div class="drop-area" id="drop" onclick="document.getElementById('fin').click()">
    <i class="fas fa-cloud-upload-alt"></i>
    <div class="dl">Drop an image here or click to upload</div>
    <div class="ds">JPG, PNG or WebP</div>
  </div>
  <input type="file" id="fin" accept="image/*" hidden/>
  <div class="canvas-stage" id="stage"><canvas id="cv"></canvas></div>

  <div class="controls" id="controls" style="display:none">
    <div class="control-row">
      <label>Blur strength</label>
      <input type="range" id="strength" min="4" max="40" value="16" oninput="document.getElementById('sVal').textContent=this.value"/>
      <span class="val" id="sVal">16</span>
    </div>
    <div class="control-row">
      <label>Style</label>
      <div class="chip-group">
        <div class="chip active" data-s="pixelate">Pixelate</div>
        <div class="chip" data-s="blur">Soft blur</div>
        <div class="chip" data-s="black">Solid block</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-secondary" onclick="undoBox()"><i class="fas fa-rotate-left"></i> Undo Last Box</button>
    <button class="btn btn-primary" id="goBtn" disabled onclick="exportImage()"><i class="fas fa-eye"></i> Create Preview</button>
    <button class="btn btn-secondary" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
let currentImg=null, boxes=[], style='pixelate';
let drawing=false,startX,startY;
const drop=document.getElementById('drop'),fin=document.getElementById('fin'),goBtn=document.getElementById('goBtn');
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
fin.onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0]);fin.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])};
document.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');style=c.dataset.s;render();
});

async function handleFile(file){
  const {img}=await loadImageFile(file);
  currentImg=img;boxes=[];
  document.getElementById('stage').classList.add('show');
  document.getElementById('controls').style.display='flex';
  goBtn.disabled=false;
  render();
}

function canvasPos(e){
  const r=cv.getBoundingClientRect();
  const scaleX=cv.width/r.width, scaleY=cv.height/r.height;
  return {x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
}
cv.addEventListener('pointerdown',e=>{
  const p=canvasPos(e);drawing=true;startX=p.x;startY=p.y;
});
cv.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const p=canvasPos(e);
  render();
  ctx.strokeStyle='#7c6aff';ctx.lineWidth=3;
  ctx.strokeRect(Math.min(startX,p.x),Math.min(startY,p.y),Math.abs(p.x-startX),Math.abs(p.y-startY));
});
cv.addEventListener('pointerup',e=>{
  if(!drawing)return;drawing=false;
  const p=canvasPos(e);
  const x=Math.min(startX,p.x),y=Math.min(startY,p.y),w=Math.abs(p.x-startX),h=Math.abs(p.y-startY);
  if(w>8&&h>8)boxes.push({x,y,w,h});
  render();
});

function render(){
  if(!currentImg)return;
  cv.width=currentImg.naturalWidth;cv.height=currentImg.naturalHeight;
  ctx.drawImage(currentImg,0,0);
  const strength=parseInt(document.getElementById('strength').value);
  boxes.forEach(b=>applyEffect(b,strength));
}
function applyEffect(b,strength){
  const {x,y,w,h}=b;
  if(style==='black'){ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);return}
  if(style==='pixelate'){
    const scale=Math.max(1,Math.floor(strength/2));
    const small=document.createElement('canvas');
    small.width=Math.max(1,Math.floor(w/scale));small.height=Math.max(1,Math.floor(h/scale));
    const sctx=small.getContext('2d');
    sctx.drawImage(cv,x,y,w,h,0,0,small.width,small.height);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(small,0,0,small.width,small.height,x,y,w,h);
    ctx.imageSmoothingEnabled=true;
  } else {
    ctx.save();
    ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.filter=`blur(${strength}px)`;
    ctx.drawImage(cv,0,0);
    ctx.restore();
  }
}
function undoBox(){boxes.pop();render()}

function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status show '+type}
async function exportImage(){
  goBtn.disabled=true;showStatus('Preparing download…','info');
  try{
    const blob=await canvasToBlob(cv,'image/png');
    downloadBlob(blob,'blurred.png');
    saveHistoryTool('Blur Face','../tools/blur-face.html');
    showStatus('✓ Ready to download!','success');
  }catch(e){showStatus('Error: '+e.message,'error')}
  goBtn.disabled=false;
}
function clearAll(){
  resetToolUploadState(()=>{
    currentImg=null;boxes=[];
    document.getElementById('stage').classList.remove('show');
    document.getElementById('controls').style.display='none';
    goBtn.disabled=true;
    document.getElementById('status').className='status';
  });
}
document.getElementById('strength').addEventListener('input',render);
</script>
<div class="tool-footer"><a class="tf-logo" href="../pages/index.html">ImageHub</a><p>Free forever · No sign-up · No uploads to server</p></div>
</body></html>
