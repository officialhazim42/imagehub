<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Convert from JPG – ImageHub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../assets/css/shared.css"/>
<script src="../assets/js/shared.js"></script>
</head>
<body>
<div id="dlModal"></div>
<nav>
  <a class="logo" href="../pages/index.html" aria-label="ImageHub home"><img src="../assets/icons/imagehub-logo.svg" alt=""/>ImageHub</a>
  <div class="nav-right-tools">
    <a class="back" href="../pages/index.html"><i class="fas fa-chevron-left"></i> All Tools</a>
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark">
      <span class="t-label" id="themeLabel">Dark</span>
      <div class="toggle-track"><div class="toggle-knob"><i class="fas fa-moon"></i></div></div>
    </div>
  </div>
</nav>
<div class="tool-wrap">
  <div class="tool-header">
    <div class="tool-icon" style="color:var(--a4)"><i class="fas fa-file-export"></i></div>
    <h1>Convert from JPG</h1>
    <p>Turn JPG images into PNG, WebP or BMP. Add multiple files at once.</p>
  </div>
  <div class="drop-area" id="drop" onclick="document.getElementById('fin').click()">
    <i class="fas fa-cloud-upload-alt"></i>
    <div class="dl">Drop JPG images here or click to upload</div>
    <div class="ds">Multiple files supported · JPG/JPEG only</div>
  </div>
  <input type="file" id="fin" accept=".jpg,.jpeg" multiple hidden/>
  <div class="file-list" id="flist"></div>

  <div class="controls" id="controls" style="display:none">
    <div class="control-row">
      <label>Output format</label>
      <div class="chip-group" id="fmtChips">
        <div class="chip active" data-fmt="image/png" data-ext="png">PNG</div>
        <div class="chip" data-fmt="image/webp" data-ext="webp">WebP</div>
        <div class="chip" data-fmt="image/bmp" data-ext="bmp">BMP</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="goBtn" disabled onclick="convertAll()"><i class="fas fa-file-export"></i> Convert</button>
    <button class="btn btn-secondary" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
  </div>
  <div class="status" id="status"></div>
  <div class="progress" id="prog"><div class="progress-bar" id="pbar"></div></div>
</div>

<script>
let files=[], fmt='image/png', ext='png';
const drop=document.getElementById('drop'),fin=document.getElementById('fin'),flist=document.getElementById('flist'),goBtn=document.getElementById('goBtn');
fin.onchange=e=>{addFiles([...e.target.files]);fin.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles([...e.dataTransfer.files].filter(f=>/jpe?g$/i.test(f.name)))};

document.querySelectorAll('#fmtChips .chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('#fmtChips .chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');fmt=c.dataset.fmt;ext=c.dataset.ext;
});

function addFiles(nf){files=[...files,...nf.filter(f=>/jpe?g$/i.test(f.name))];render()}
function render(){
  flist.innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div');d.className='file-item';
    d.innerHTML=`<i class="fas fa-file-image"></i><span class="fn">${f.name}</span><span class="fs">${fmtSize(f.size)}</span><button class="rm" onclick="remove(${i})"><i class="fas fa-times"></i></button>`;
    flist.appendChild(d);
  });
  goBtn.disabled=files.length===0;
  document.getElementById('controls').style.display=files.length?'flex':'none';
}
function remove(i){files.splice(i,1);render()}
function clearAll(){
  resetToolUploadState(()=>{
    files=[];render();document.getElementById('status').className='status';document.getElementById('prog').classList.remove('show');
  });
}
function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status show '+type}

async function convertAll(){
  goBtn.disabled=true;showStatus('Converting…','info');
  const prog=document.getElementById('prog'),pbar=document.getElementById('pbar');
  prog.classList.add('show');
  try{
    const results=[];
    for(let i=0;i<files.length;i++){
      pbar.style.width=((i)/files.length*90+5)+'%';
      const {img}=await loadImageFile(files[i]);
      const canvas=document.createElement('canvas');
      canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
      canvas.getContext('2d').drawImage(img,0,0);
      const blob=await canvasToBlob(canvas,fmt);
      results.push({blob,name:files[i].name.replace(/\.[^.]+$/,'')+'.'+ext,beforeSrc:img.src});
    }
    pbar.style.width='100%';
    downloadBlob(results);
    showStatus(`✓ Converted ${results.length} image${results.length===1?'':'s'}. Review the preview, then download.`,'success');
    saveHistoryTool('Convert from JPG','../tools/convert-from-jpg.html');
  }catch(e){showStatus('Error: '+e.message,'error')}
  goBtn.disabled=false;
}
</script>
<div class="tool-footer"><a class="tf-logo" href="../pages/index.html">ImageHub</a><p>Free forever · No sign-up · No uploads to server</p></div>
</body></html>
