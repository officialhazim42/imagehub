<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description" content="ImageHub guide library with step-by-step instructions and tips for every image tool." />
  <title>ImageHub Guides & Tips</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg:#07070d;--s1:#0f0f1a;--s2:#161625;--border:#252538;--text:#eeeef8;--muted:#6b6b8a;--accent:#7c6aff;--a2:#ff5f7e;--a3:#00e5a0;--a4:#ffb347;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 10% 0%, rgba(124,106,255,.14), transparent 60%), radial-gradient(ellipse 55% 45% at 90% 90%, rgba(255,95,126,.08), transparent 58%);pointer-events:none;z-index:0}
    a{text-decoration:none;color:inherit} nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 6%;height:64px;background:rgba(7,7,13,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
    .logo{display:inline-flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--a2));background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
    .logo img{width:34px;height:34px;display:block}
    .nav-links{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .nav-links a{padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--s1);color:var(--muted);font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .nav-links a:hover{color:var(--text);border-color:var(--accent)}
    .guide-shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:56px 6% 80px}
    .hero{padding:34px 26px 28px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(135deg,rgba(124,106,255,.08),rgba(255,95,126,.04));text-align:center;box-shadow:0 18px 42px rgba(14,15,22,.16)}
    .hero .badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid rgba(0,229,160,.22);background:rgba(0,229,160,.08);color:var(--a3);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .hero .dot{width:6px;height:6px;border-radius:50%;background:var(--a3);display:inline-block}
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(2.4rem,5vw,4rem);line-height:1.08;letter-spacing:-1.8px;margin:18px 0 10px}
    .hero p{max-width:700px;margin:0 auto;color:var(--muted);font-size:1.02rem;line-height:1.7}
    .guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:28px}
    .guide-card{padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--s1);box-shadow:0 12px 24px rgba(10,10,16,.08)}
    .guide-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
    .guide-tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:rgba(124,106,255,.08);border:1px solid rgba(124,106,255,.22);color:var(--accent);font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .guide-count{font-size:.65rem;color:var(--muted);font-weight:700}
    .guide-card h3{font-family:'Syne',sans-serif;font-size:1.1rem;letter-spacing:-.2px;margin:0 0 16px}
    .guide-list-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .guide-list-grid h4{margin:0 0 8px;color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .guide-list-grid ol,.guide-list-grid ul{margin:0;padding-left:18px;display:grid;gap:8px}
    .guide-list-grid li{color:var(--muted);font-size:.79rem;line-height:1.7}
    .tool-link{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#9b8cff);color:#fff;font-weight:700;font-size:.78rem}
    @media (max-width:640px){.guide-list-grid{grid-template-columns:1fr}.nav-links a{padding:7px 10px;font-size:.68rem}.hero{padding:26px 18px}} 
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html" aria-label="ImageHub home"><img src="icons/imagehub-logo.svg" alt="" />ImageHub</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="history.html">History</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <main class="guide-shell">
    <section class="hero">
      <div class="badge"><span class="dot"></span>Guides & Tips</div>
      <h1>Everything you need to use each tool confidently.</h1>
      <p>Use this reference library whenever you want quick instructions, quality tips, and best practices without interrupting your workflow inside the tool workspace.</p>
    </section>

    <section class="guide-grid" id="guidesPage"></section>
  </main>

  <script>
    const guideMap = {
      'Compress IMAGE': { steps: ['Upload a JPG, PNG, or WebP image.', 'Move the quality slider to find the right balance between size and clarity.', 'Check the estimated output size before downloading.', 'Save the optimized file to share or post online.'], tips: ['Use 70–80% quality for quick web sharing.', 'Keep the original file in case you want to re-export later.', 'JPG is usually the lightest option for photos.'] },
      'Upscale': { steps: ['Load the image you want to enlarge.', 'Choose the scale or output dimensions that fit your needs.', 'Review the preview for sharpness and detail.', 'Export the enhanced image in the desired format.'], tips: ['Upscaling works best when the source image is already reasonably clear.', 'Use the smallest enlargement needed to avoid excessive artifacting.', 'Keep a backup of the original if you want to compare results.'] },
      'Remove Background': { steps: ['Upload an image with a clear subject.', 'Let the background remover analyze the cutout.', 'Preview the result and adjust any needed detail or edge settings.', 'Download the transparent or cleaned export.'], tips: ['Simple backgrounds and high contrast usually produce cleaner cutouts.', 'Avoid very tiny details or fuzzy edges if you need a precise background removal.', 'Try export as PNG when transparency matters.'] },
      'Photo Editor': { steps: ['Upload the image you want to improve.', 'Adjust light, color, filters, or text layers.', 'Use the preview to refine the edit before exporting.', 'Download the final image when it looks right.'], tips: ['Start with subtle edits before increasing exposure or saturation.', 'Use text sparingly so it stays readable and polished.', 'Preview the result at full size before saving.'] },
      'Resize IMAGE': { steps: ['Choose the image you want to resize.', 'Set width, height, or percentage values.', 'Keep aspect ratio locked unless you intentionally want distortion.', 'Download the resized version.'], tips: ['Resize before uploading to social platforms to avoid oversized files.', 'Use exact dimension presets for banners, avatars, or profile images.', 'Check the output on a device preview before finalizing.'] },
      'Crop IMAGE': { steps: ['Load the image and frame the area you want to keep.', 'Choose an aspect ratio if needed.', 'Preview the crop before confirming.', 'Download the trimmed image.'], tips: ['Crop first to remove distractions and improve focus.', 'Shoot for balanced composition so the crop feels intentional.', 'A tighter crop often feels cleaner on social media.'] },
      'Rotate IMAGE': { steps: ['Upload the image that needs rotation.', 'Select the angle or flip option you want.', 'Check the preview for the final orientation.', 'Download the corrected file.'], tips: ['Use the smallest adjustment needed to correct the image.', 'Flip horizontally only when you intentionally want a mirrored result.', 'Review the final image before posting to avoid awkward portrait rotation.'] },
      'Convert to JPG': { steps: ['Choose a PNG, WebP, HEIC, or other compatible source file.', 'Pick the JPG quality you prefer.', 'Preview the output size estimate and final result.', 'Download the JPG version.'], tips: ['JPG is excellent for photos and email sharing.', 'Lower quality values reduce file size significantly.', 'Use PNG if you need transparent backgrounds.'] },
      'Convert from JPG': { steps: ['Upload the JPG image.', 'Select the new output format such as PNG or WebP.', 'Review the converted preview and dimensions.', 'Download the converted image.'], tips: ['Use PNG when you need transparency or crisp text.', 'Use WebP for a smaller file without much visual loss.', 'Keep the original in case you want to reconvert again later.'] },
      'HTML to IMAGE': { steps: ['Paste HTML or enter a URL to capture.', 'Adjust the page sizing or output settings if available.', 'Preview the rendered image before capture.', 'Download your generated image file.'], tips: ['Simplify the page design for cleaner screenshots.', 'Use a fixed width when you need a consistent social or card layout.', 'Check the final image for any broken CSS or mobile layout issues.'] },
      'Watermark IMAGE': { steps: ['Upload the image you want to protect.', 'Add your text or logo watermark with the desired size and placement.', 'Preview the result on the sample image.', 'Download the watermarked export.'], tips: ['Place the watermark in a corner to avoid blocking the subject.', 'Use semi-transparent text for a cleaner, less intrusive mark.', 'Keep the watermark readable without overwhelming the image.'] },
      'Blur Face': { steps: ['Upload the image containing one or more faces.', 'Select the blur area or use the face detection controls.', 'Preview the blurred result to confirm privacy protection.', 'Download the final image.'], tips: ['Use blur on faces or sensitive details to protect privacy.', 'Check the edges so the blur remains clean and natural.', 'A stronger blur works well for full-privacy masking.'] },
      'Meme Generator': { steps: ['Choose a base image or upload your own.', 'Add the top and bottom text.', 'Adjust size, color, spacing, and style.', 'Download the meme and share it.'], tips: ['Keep text short and high contrast for readability.', 'Use a bold font for small screens and mobile viewing.', 'Try a big empty caption area if the image is busy.'] }
    };

    function slugify(label) {
      return label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

        document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('guidesPage');
      if (!grid) return;
      const cards = Object.entries(guideMap).map(([tool, guide]) => {
        const slug = slugify(tool);
        const article = document.createElement('article');
        article.className = 'guide-card';
        article.id = slug;

        const header = document.createElement('div');
        header.className = 'guide-card-header';
        const tag = document.createElement('span');
        tag.className = 'guide-tag';
        tag.textContent = tool;
        const count = document.createElement('span');
        count.className = 'guide-count';
        count.textContent = `${guide.steps.length} steps`;
        header.append(tag, count);

        const title = document.createElement('h3');
        title.textContent = `How to use ${tool}`;

        const listGrid = document.createElement('div');
        listGrid.className = 'guide-list-grid';

        const stepWrap = document.createElement('div');
        const stepTitle = document.createElement('h4');
        stepTitle.textContent = 'Quick steps';
        const stepList = document.createElement('ol');
        stepList.innerHTML = guide.steps.map(step => `<li>${step}</li>`).join('');
        stepWrap.append(stepTitle, stepList);

        const tipWrap = document.createElement('div');
        const tipTitle = document.createElement('h4');
        tipTitle.textContent = 'Helpful tips';
        const tipList = document.createElement('ul');
        tipList.innerHTML = guide.tips.map(tip => `<li>${tip}</li>`).join('');
        tipWrap.append(tipTitle, tipList);

        listGrid.append(stepWrap, tipWrap);

        const action = document.createElement('a');
        action.className = 'tool-link';
        action.href = `tools/${slug}.html`;
        action.innerHTML = '<i class="fas fa-arrow-right"></i> Open tool';

        article.append(header, title, listGrid, action);
        return article;
      });
      cards.forEach(card => grid.appendChild(card));
      if (location.hash) {
        const target = document.querySelector(location.hash);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  </script>
</body>
</html>
